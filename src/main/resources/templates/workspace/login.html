<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>로그인 · 사업기록</title>
    <link rel="stylesheet" th:href="@{/workspace-assets/work.css}" />
  </head>
  <body>
    <main class="login-shell">
      <div class="login-symbol">
        <span class="brand-symbol" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-12-2 14" /></svg
        ></span>
      </div>
      <h1>사업기록에 로그인</h1>
      <p class="muted">사업과 업무 처리 이력을 관리합니다.</p>
      <form class="login-card" th:action="@{/workspace/login}" method="post">
        <p th:if="${param.error}" class="error">
          계정 또는 비밀번호를 확인하세요.
        </p>
        <p th:if="${param.logout}" class="notice">로그아웃했습니다.</p>
        <label for="username">계정</label
        ><input
          id="username"
          name="username"
          autocomplete="username"
          required
        /><label for="password">비밀번호</label
        ><input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
          required
        /><button class="primary">로그인</button>
      </form>
      <details>
        <summary>로컬 데모 계정</summary>
        <p>
          편집: <code>editor / Portfolio-2026!</code><br />조회:
          <code>viewer / View-2026!</code>
        </p>
        <p class="muted">
          환경 변수로 비밀번호를 변경했다면 설정한 값을 사용하세요.
        </p>
      </details>
      <p class="muted">가상 사업을 사용하는 개인 학습 프로젝트입니다.</p>
    </main>
  </body>
</html>
