<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>사업 목록 · 사업기록</title>
    <link rel="stylesheet" th:href="@{/workspace-assets/work.css}" />
  </head>
  <body>
    <div class="shell">
      <header th:replace="~{workspace/common :: header}"></header>
      <main>
        <div class="page-head">
          <div>
            <p class="eyebrow">WORKSPACE / PROJECTS</p>
            <h1>사업 현황</h1>
            <p class="muted">
              일정과 담당 업무를 확인하고, 변경 과정을 기록합니다.
            </p>
          </div>
          <a
            th:if="${canEdit}"
            class="primary"
            th:href="@{/workspace/projects/new}"
            >+ 사업 등록</a
          >
        </div>
        <p th:if="${notice}" th:text="${notice}" class="notice"></p>
        <section class="stats" aria-label="사업 현황 요약">
          <div>
            <span>전체 사업</span><strong th:text="${stats.total}">0</strong>
          </div>
          <div>
            <span>진행 중</span><strong th:text="${stats.active}">0</strong>
          </div>
          <div>
            <span>완료</span><strong th:text="${stats.completed}">0</strong>
          </div>
          <div>
            <span>마감 경과</span><strong th:text="${stats.overdue}">0</strong>
          </div>
        </section>
        <form class="filters" th:action="@{/workspace}" method="get">
          <label for="q" class="sr-only">사업 검색</label
          ><input
            id="q"
            name="q"
            th:value="${q}"
            maxlength="100"
            placeholder="사업명 · 코드 · 담당 검색"
          /><label for="status" class="sr-only">상태</label
          ><select name="status" id="status">
            <option value="">모든 상태</option>
            <option
              th:each="s:${workStatuses}"
              th:value="${s}"
              th:text="${s.label}"
              th:selected="${s==selectedStatus}"
            ></option></select
          ><button>검색</button
          ><a class="text-link" th:href="@{/workspace}">초기화</a>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>사업 / 코드</th>
                <th>담당</th>
                <th>일정</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p:${projects.content}">
                <td>
                  <a
                    class="project-name"
                    th:href="@{/workspace/projects/{id}(id=${p.id})}"
                    th:text="${p.name}"
                  ></a
                  ><small th:text="${p.code}"></small>
                </td>
                <td th:text="${p.owner}"></td>
                <td>
                  <span th:text="${p.dueDate}"></span
                  ><small
                    class="late"
                    th:if="${p.status.name()!='COMPLETED' and p.dueDate.isBefore(today)}"
                    >마감 경과</small
                  >
                </td>
                <td>
                  <span
                    class="badge"
                    th:attr="data-status=${p.status}"
                    th:text="${p.status.label}"
                  ></span>
                </td>
              </tr>
              <tr th:if="${projects.empty}">
                <td colspan="4" class="empty">
                  검색 조건에 맞는 사업이 없습니다.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="페이지">
          <a
            th:if="${projects.hasPrevious()}"
            th:href="@{/workspace(q=${q},status=${selectedStatus},page=${projects.number-1})}"
            >← 이전</a
          ><span
            th:text="|${projects.number+1} / ${projects.totalPages==0?1:projects.totalPages} 페이지 · ${projects.totalElements}건|"
          ></span
          ><a
            th:if="${projects.hasNext()}"
            th:href="@{/workspace(q=${q},status=${selectedStatus},page=${projects.number+1})}"
            >다음 →</a
          >
        </nav>
      </main>
      <footer th:replace="~{workspace/common :: footer}"></footer>
    </div>
  </body>
</html>
