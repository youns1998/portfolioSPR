<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <body>
    <header th:fragment="header" class="app-header">
      <div class="topbar">
        <a class="brand" th:href="@{/workspace}"
          ><span class="brand-symbol" aria-hidden="true"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-12-2 14" /></svg></span
          ><span><span class="brand-owner">workspace / </span>사업기록</span></a
        >
        <form th:action="@{/workspace/logout}" method="post">
          <button class="link" type="submit">로그아웃</button>
        </form>
      </div>
      <nav class="app-tabs" aria-label="주 메뉴">
        <a th:href="@{/workspace}" aria-current="page">사업 목록</a
        ><a th:href="@{/workspace/export.csv}">CSV 내보내기</a>
      </nav>
    </header>
    <footer th:fragment="footer">
      개인 포트폴리오 · 샘플 사업·담당자는 가상 데이터입니다. 실제 기관
      시스템이나 수행 실적이 아닙니다.
    </footer>
  </body>
</html>
