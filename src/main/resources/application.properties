spring.application.name=portfolioSPR

# Volatile database: no database file is created on disk.
spring.datasource.url=jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.h2.console.enabled=false

spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.web.error.whitelabel.enabled=false

# Override in production: APP_IP_HASH_SECRET=a-long-random-secret
app.ip-hash-secret=${APP_IP_HASH_SECRET:local-development-secret-change-me}
