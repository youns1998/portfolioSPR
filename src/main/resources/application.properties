spring.application.name=portfolioSPR

# Local persistent demo database. Tests use a separate in-memory database.
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:./data/portfolio;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.h2.console.enabled=false

spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.web.error.whitelabel.enabled=false

# Override in production: APP_IP_HASH_SECRET=a-long-random-secret
app.ip-hash-secret=${APP_IP_HASH_SECRET:local-development-secret-change-me}

server.address=127.0.0.1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.editor-password=${APP_EDITOR_PASSWORD:Portfolio-2026!}
app.viewer-password=${APP_VIEWER_PASSWORD:View-2026!}
